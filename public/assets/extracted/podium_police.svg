<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 215" width="100%" height="100%">
  <defs>
    <linearGradient id="policeWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="policeBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="policeGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="165" cy="185" rx="140" ry="18" fill="#000000" opacity="0.6"/>

  <!-- Wheels -->
  <ellipse cx="250" cy="162" rx="27" ry="27" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <ellipse cx="250" cy="162" rx="14" ry="14" fill="#64748B" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="250" cy="162" r="5" fill="#0F172A"/>

  <ellipse cx="85" cy="162" rx="25" ry="25" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <ellipse cx="85" cy="162" rx="13" ry="13" fill="#64748B" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="85" cy="162" r="5" fill="#0F172A"/>

  <!-- Main Sedan Body -->
  <path d="M25 152 Q35 138 72 136 L108 132 Q130 96 175 94 L235 98 Q268 108 288 132 L300 152 Q265 170 215 168 L115 168 Q65 170 25 152 Z" fill="url(#policeWhite)" stroke="#0F172A" stroke-width="4"/>

  <!-- Blue Highway Patrol Livery Stripe -->
  <path d="M30 150 L85 146 Q140 144 210 144 L295 145 L290 162 L220 164 L110 164 L32 158 Z" fill="url(#policeBlue)" stroke="#0F172A" stroke-width="2"/>
  <text x="160" y="157" font-family="Outfit, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="2">POLISI</text>
  <text x="235" y="156" font-family="Outfit, sans-serif" font-weight="900" font-size="8" fill="#FACC15">PATWAL</text>

  <!-- Cabin Windows -->
  <path d="M106 132 L128 102 L172 102 L168 132 Z" fill="url(#policeGlass)" stroke="#0F172A" stroke-width="3"/>
  <path d="M174 132 L178 102 L225 104 L245 132 Z" fill="url(#policeGlass)" stroke="#0F172A" stroke-width="3"/>

  <!-- Roof Lightbar Siren Mount -->
  <rect x="155" y="90" width="38" height="6" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Blue Strobes (Left) -->
  <rect x="150" y="80" width="22" height="10" rx="3" fill="#3B82F6" stroke="#0F172A" stroke-width="2"/>
  <ellipse cx="160" cy="85" rx="18" ry="12" fill="#3B82F6" opacity="0.45"/>
  <!-- Red Strobes (Right) -->
  <rect x="176" y="80" width="22" height="10" rx="3" fill="#EF4444" stroke="#0F172A" stroke-width="2"/>
  <ellipse cx="187" cy="85" rx="18" ry="12" fill="#EF4444" opacity="0.45"/>
  <!-- Center White Speaker horn -->
  <rect x="170" y="82" width="8" height="7" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Front Push-Bumper / Bullbar -->
  <path d="M18 142 L24 165 L28 165 L22 142 Z" fill="#334155" stroke="#0F172A" stroke-width="2"/>
  <path d="M14 150 L32 150" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

  <!-- Headlights -->
  <ellipse cx="36" cy="144" rx="8" ry="9" fill="#FEF08A" stroke="#0F172A" stroke-width="2"/>
  <ellipse cx="34" cy="144" rx="4" ry="5" fill="#FFFFFF"/>
</svg>